<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>Signal — Ami Nigam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --primary-bg:#ffffff;
  --primary-text:#0d0d0d;
  --text-secondary:#555555;
  --text-tertiary:#575757;
  --text-faint:#999999;
  --border-tertiary:rgba(0,0,0,0.19);
  --border-faint:rgba(0,0,0,0.06);
  --accent:#8B5CF6;
  --accent-dim:rgba(139,92,246,0.10);
  --hot:#ef4444;
  --warm:#f59e0b;
  --cool:#3b82f6;
  --cold:#6b7280;
  --green:#22c55e;
  --card-bg:rgba(0,0,0,0.015);
  --card-bg-hover:rgba(0,0,0,0.04);
  --glow:rgba(139,92,246,0.06);
  --quote-bg:rgba(0,0,0,0.03);
}
[data-theme="dark"]{
  --primary-bg:#0a0a0a;
  --primary-text:#f0ede8;
  --text-secondary:#a0a0a0;
  --text-tertiary:#838383;
  --text-faint:#555555;
  --border-tertiary:rgba(255,255,255,0.12);
  --border-faint:rgba(255,255,255,0.06);
  --accent:#A78BFA;
  --accent-dim:rgba(167,139,250,0.08);
  --hot:#f87171;
  --warm:#fbbf24;
  --cool:#60a5fa;
  --cold:#6b7280;
  --green:#4ade80;
  --card-bg:rgba(255,255,255,0.025);
  --card-bg-hover:rgba(255,255,255,0.05);
  --glow:rgba(167,139,250,0.05);
  --quote-bg:rgba(255,255,255,0.04);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  font-weight:300;
  background:var(--primary-bg);
  color:var(--primary-text);
  overflow-x:hidden;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .4s ease,color .4s ease;
  padding-top:48px;
}
a{color:inherit;text-decoration:none}

/* SPECTRAL LINE */
.spectral-line{
  position:fixed;top:0;left:0;right:0;z-index:1000;height:2px;
  background:linear-gradient(90deg,#7c3aed,#3b82f6,#06b6d4,#22c55e,#f59e0b,#ef4444,#7c3aed);
  background-size:600px 100%;
  animation:spectral-scroll 6s linear infinite;
  pointer-events:none
}
@keyframes spectral-scroll{from{background-position:0 0}to{background-position:600px 0}}

/* TOP BAR */
.top-bar{
  position:fixed;top:2px;left:0;right:0;z-index:999;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;
  background:var(--primary-bg);
  transition:background .4s ease;
  border-bottom:0.5px solid var(--border-tertiary);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px)
}
.top-bar a{
  font-size:13px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--primary-text);transition:color .3s
}
.top-bar a:hover{color:var(--accent)}
.top-bar-right{display:flex;align-items:center;gap:14px}
.live-pulse{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-tertiary);
  font-family:'JetBrains Mono',monospace
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  animation:pulse 2s ease-in-out infinite
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.4)}
  50%{opacity:.5;box-shadow:0 0 0 5px rgba(34,197,94,0)}
}
.theme-toggle{
  background:none;border:none;cursor:pointer;
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);transition:color .3s;
  font-size:16px;line-height:1
}
.theme-toggle:hover{color:var(--primary-text)}

/* CONTAINER */
.wrap{max-width:640px;margin:0 auto;padding:0 18px}

/* HEADER */
.header{padding:28px 0 20px}
.header h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,10vw,56px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
  margin-bottom:6px
}
.header h1 em{
  font-style:italic;font-weight:400;color:var(--accent)
}
.header .subtitle{
  font-size:13px;color:var(--text-tertiary);
  font-weight:300;line-height:1.6;
  max-width:440px
}
.header .scan-time{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--text-faint);
  margin-top:10px;
  display:flex;align-items:center;gap:8px
}
.header .scan-time::before{
  content:'';display:block;width:24px;height:0.5px;background:var(--border-tertiary)
}

/* CROWD SIGNALS — the hero section */
.crowd-section{padding:8px 0 28px}

.crowd-label{
  font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:.14em;
  color:var(--text-tertiary);
  margin-bottom:14px;
  display:flex;align-items:center;gap:10px
}
.crowd-label .pulse-small{
  width:6px;height:6px;border-radius:50%;background:var(--hot);
  animation:pulse-small 1.5s ease-in-out infinite
}
@keyframes pulse-small{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}
.crowd-label::after{
  content:'';flex:1;height:0.5px;background:var(--border-tertiary)
}

.crowd-signal{
  position:relative;
  background:var(--card-bg);
  border:0.5px solid var(--border-faint);
  border-radius:14px;
  padding:18px 16px 16px;
  margin-bottom:10px;
  overflow:hidden;
  opacity:0;transform:translateY(14px);
  animation:rise .5s cubic-bezier(.22,1,.36,1) forwards
}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

/* Heat glow background */
.crowd-signal.heat-hot::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--hot),transparent);
  opacity:.6
}
.crowd-signal.heat-warm::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--warm),transparent);
  opacity:.5
}
.crowd-signal.heat-cool::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cool),transparent);
  opacity:.3
}

.crowd-signal:active{
  background:var(--card-bg-hover);
  transform:scale(.99)
}

.crowd-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;margin-bottom:10px
}
.crowd-name{
  font-family:'Playfair Display',serif;
  font-size:clamp(20px,5vw,26px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.01em;
  flex:1
}
.crowd-heat-badge{
  font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  padding:3px 8px;border-radius:4px;
  white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:4px
}
.crowd-heat-badge .heat-flame{
  font-size:8px;line-height:1
}
.heat-hot .crowd-heat-badge{background:rgba(239,68,68,0.12);color:var(--hot)}
.heat-warm .crowd-heat-badge{background:rgba(245,158,11,0.12);color:var(--warm)}
.heat-cool .crowd-heat-badge{background:rgba(59,130,246,0.12);color:var(--cool)}

[data-theme="dark"] .heat-hot .crowd-heat-badge{background:rgba(248,113,113,0.12)}
[data-theme="dark"] .heat-warm .crowd-heat-badge{background:rgba(251,191,36,0.12)}
[data-theme="dark"] .heat-cool .crowd-heat-badge{background:rgba(96,165,250,0.12)}

.crowd-desc{
  font-size:14px;font-weight:300;
  color:var(--text-secondary);
  line-height:1.65;
  margin-bottom:12px
}

.crowd-meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:12px
}
.crowd-source-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:500;
  padding:2px 7px;border-radius:3px;
  background:var(--accent-dim);color:var(--accent);
  letter-spacing:.03em
}
.crowd-volume{
  font-size:10px;font-weight:400;
  color:var(--text-faint);
  display:flex;align-items:center;gap:4px
}
.crowd-volume-bar{
  display:inline-flex;gap:2px;align-items:flex-end
}
.crowd-volume-bar span{
  width:3px;border-radius:1px;
  background:var(--text-faint);
  opacity:.4
}
.crowd-volume-bar span:nth-child(1){height:4px}
.crowd-volume-bar span:nth-child(2){height:7px}
.crowd-volume-bar span:nth-child(3){height:10px}
.crowd-volume-bar span:nth-child(4){height:13px}
.crowd-volume.high span{opacity:.9;background:var(--hot)}
.crowd-volume.medium span:nth-child(-n+3){opacity:.7;background:var(--warm)}
.crowd-volume.medium span:nth-child(4){opacity:.2}
.crowd-volume.low span:nth-child(-n+2){opacity:.5}
.crowd-volume.low span:nth-child(n+3){opacity:.15}

.crowd-sentiment{
  font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-faint)
}

/* Sample quotes */
.crowd-quotes{
  margin-top:10px;
  padding-top:12px;
  border-top:0.5px solid var(--border-faint)
}
.quote{
  padding:8px 12px;
  background:var(--quote-bg);
  border-radius:8px;
  margin-bottom:6px;
  font-size:13px;font-weight:300;
  color:var(--text-secondary);
  line-height:1.6;
  position:relative
}
.quote:last-child{margin-bottom:0}
.quote .quote-platform{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);
  margin-bottom:3px
}
.quote .quote-text{font-style:italic}
.quote .quote-author{
  font-size:11px;font-weight:400;
  color:var(--text-faint);
  margin-top:2px
}
.quote .quote-author a{color:var(--accent);border-bottom:0.5px solid var(--accent-dim)}

/* NEWS FEED */
.news-section{padding:8px 0 28px}
.news-label{
  font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:.14em;
  color:var(--text-tertiary);
  margin-bottom:14px;
  display:flex;align-items:center;gap:10px
}
.news-label::after{
  content:'';flex:1;height:0.5px;background:var(--border-tertiary)
}

.news-item{
  background:var(--card-bg);
  border:0.5px solid var(--border-faint);
  border-radius:12px;
  padding:14px 14px 12px;
  margin-bottom:8px;
  transition:border-color .2s,transform .15s;
  opacity:0;transform:translateY(10px);
  animation:rise .4s ease forwards
}
.news-item:active{
  border-color:var(--accent);
  transform:scale(.99)
}
.news-item.relevance-high{border-left:3px solid var(--hot);padding-left:12px}
.news-item.relevance-medium{border-left:3px solid var(--warm);padding-left:12px}
.news-item.relevance-low{border-left:3px solid var(--cool);padding-left:12px}

.news-meta{
  display:flex;align-items:center;gap:6px;
  margin-bottom:6px;flex-wrap:wrap
}
.news-source{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:500;
  color:var(--text-tertiary);
  display:flex;align-items:center;gap:4px
}
.news-source .source-icon{
  font-size:9px;opacity:.7
}
.news-category{
  font-size:9px;font-weight:500;
  text-transform:uppercase;letter-spacing:.05em;
  padding:2px 6px;border-radius:3px;
  background:var(--accent-dim);color:var(--accent)
}
.news-relevance{
  font-size:8px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  padding:2px 6px;border-radius:3px
}
.relevance-high .news-relevance{background:rgba(239,68,68,0.12);color:var(--hot)}
.relevance-medium .news-relevance{background:rgba(245,158,11,0.12);color:var(--warm)}
.relevance-low .news-relevance{background:rgba(59,130,246,0.12);color:var(--cool)}
[data-theme="dark"] .relevance-high .news-relevance{background:rgba(248,113,113,0.12)}
[data-theme="dark"] .relevance-medium .news-relevance{background:rgba(251,191,36,0.12)}
[data-theme="dark"] .relevance-low .news-relevance{background:rgba(96,165,250,0.12)}

.news-title{
  font-size:15px;font-weight:500;
  color:var(--primary-text);
  line-height:1.45;
  margin-bottom:5px
}
.news-title a{
  border-bottom:0.5px solid transparent;
  transition:border-color .2s
}
.news-title a:hover{border-bottom-color:var(--accent)}
.news-title .no-link{color:var(--text-secondary)}

.news-summary{
  font-size:13px;font-weight:300;
  color:var(--text-secondary);
  line-height:1.6;
  margin-bottom:6px
}
.news-so-what{
  font-size:12px;font-weight:400;
  color:var(--primary-text);
  line-height:1.55;
  padding:7px 10px;
  background:var(--accent-dim);
  border-radius:6px;
  margin-bottom:5px
}
.news-so-what::before{
  content:'SO WHAT — ';
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;
  letter-spacing:.08em;color:var(--accent)
}
.news-projects{
  display:flex;flex-wrap:wrap;gap:4px;
  margin-bottom:4px
}
.project-tag{
  font-size:10px;font-weight:500;
  padding:2px 7px;border-radius:3px;
  border:0.5px solid var(--border-faint);
  color:var(--text-tertiary)
}
.news-action{
  font-size:12px;font-weight:400;
  color:var(--text-tertiary);
  margin-top:3px;font-style:italic
}
.news-action::before{content:'→ ';font-style:normal;color:var(--accent)}

/* EMPTY STATE */
.empty{
  padding:48px 20px;text-align:center
}
.empty .empty-icon{
  font-family:'Playfair Display',serif;
  font-size:48px;opacity:.2;margin-bottom:12px
}
.empty p{
  font-size:14px;color:var(--text-tertiary);
  font-weight:300;line-height:1.7;max-width:320px;margin:0 auto
}
.empty .empty-code{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--accent);opacity:.4;margin-top:10px
}

/* LOADING */
.loading{padding:20px 0}
.loading-line{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--text-tertiary);
  line-height:2;opacity:0;
  animation:fade-in .4s ease forwards
}
@keyframes fade-in{to{opacity:1}}

/* FOOTER */
.footer{
  padding:16px 0 36px;
  border-top:0.5px solid var(--border-tertiary);
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;color:var(--text-faint);
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.05em
}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-tertiary);border-radius:2px}

a:focus-visible,button:focus-visible{outline:1px solid var(--primary-text);outline-offset:3px}

/* REDUCED MOTION */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
  .spectral-line{animation:none}
  .crowd-signal,.news-item{opacity:1;transform:none}
}

/* MOBILE */
@media(max-width:640px){
  body{padding-top:44px}
  .top-bar{padding:8px 16px}
  .wrap{padding:0 16px}
  .header{padding:24px 0 16px}
  .crowd-section{padding:4px 0 24px}
  .news-section{padding:4px 0 24px}
  .footer{padding:14px 0 28px}
}
@media(max-width:380px){
  .crowd-name{font-size:18px}
  .news-title{font-size:14px}
  .crowd-heat-badge{font-size:8px;padding:2px 6px}
}
</style>
</head>
<body>

<div class="spectral-line" aria-hidden="true"></div>

<header class="top-bar">
  <a href="/" aria-label="Back to home">← Ami Nigam</a>
  <div class="top-bar-right">
    <div class="live-pulse"><span class="live-dot"></span><span>Live</span></div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode"><span id="themeIcon">☀</span></button>
  </div>
</header>

<div class="wrap">
  <div class="header">
    <h1><em>Signal</em></h1>
    <p class="subtitle">What the crowd is saying about AI in design, architecture, and AEC. Bottom-up, not top-down. Updated daily.</p>
    <div class="scan-time" id="scanTime">scanning…</div>
  </div>

  <!-- CROWD SIGNALS -->
  <section class="crowd-section">
    <div class="crowd-label"><span class="pulse-small"></span>What the crowd is buzzing about</div>
    <div id="crowdSignals"></div>
  </section>

  <!-- NEWS FEED -->
  <section class="news-section">
    <div class="news-label">Backing signals</div>
    <div id="newsFeed"></div>
  </section>

  <div class="footer">
    <span>signal v2.0</span>
    <span id="footerDate"></span>
  </div>
</div>

<script>
(function(){
  'use strict';

  var toggle=document.getElementById('themeToggle');
  var icon=document.getElementById('themeIcon');
  var html=document.documentElement;
  function setTheme(t){
    if(t==='dark'){html.setAttribute('data-theme','dark');icon.textContent='☾'}
    else{html.removeAttribute('data-theme');icon.textContent='☀'}
    try{localStorage.setItem('theme',t)}catch(e){}
  }
  toggle.addEventListener('click',function(){
    setTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  try{var s=localStorage.getItem('theme');if(s)setTheme(s)}catch(e){}

  var scanTime=document.getElementById('scanTime');
  var crowdSignals=document.getElementById('crowdSignals');
  var newsFeed=document.getElementById('newsFeed');
  var footerDate=document.getElementById('footerDate');

  var loadMsgs=[
    'scanning X, Reddit, LinkedIn…',
    'clustering crowd signals…',
    'finding backing news…',
    'cross-referencing projects…'
  ];
  var msgI=0;
  var msgTimer=setInterval(function(){
    msgI++;
    if(msgI<loadMsgs.length) scanTime.textContent=loadMsgs[msgI];
    else clearInterval(msgTimer);
  },800);

  fetch('signal/data.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
    .then(function(data){ clearInterval(msgTimer); render(data); })
    .catch(function(){ clearInterval(msgTimer); renderEmpty(); });

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function render(data){
    var d=data.date||new Date().toISOString().split('T')[0];
    footerDate.textContent=d;
    if(data.generated_at){
      var time=data.generated_at.split('T')[1];
      if(time) time=time.substring(0,5)+' UTC';
      scanTime.textContent='last scan: '+d+' '+time;
    } else {
      scanTime.textContent=d;
    }

    // Crowd signals
    if(data.crowd_signals&&data.crowd_signals.length){
      crowdSignals.innerHTML=data.crowd_signals.map(function(s,i){
        var heatClass='heat-'+(s.heat||'warm');
        var volClass='volume '+(s.volume||'medium');
        var sourceTags=(s.sources||[]).map(function(src){
          return '<span class="crowd-source-tag">'+esc(src)+'</span>';
        }).join('');
        var volBars='<span class="crowd-volume-bar '+volClass+'"><span></span><span></span><span></span><span></span></span>';
        var sentiment=s.sentiment?'<span class="crowd-sentiment">'+esc(s.sentiment)+'</span>':'';
        var relatedNews='';
        if(s.related_news&&s.related_news.length){
          relatedNews='<div style="font-size:10px;color:var(--text-faint);margin-top:8px;font-family:JetBrains Mono,monospace">→ backed by '+s.related_news.length+' news '+(s.related_news.length===1?'item':'items')+'</div>';
        }
        var quotes='';
        if(s.sample_quotes&&s.sample_quotes.length){
          quotes='<div class="crowd-quotes">';
          s.sample_quotes.forEach(function(q){
            var authorHtml=q.author?(q.url?'<div class="quote-author"><a href="'+esc(q.url)+'" target="_blank" rel="noopener noreferrer">'+esc(q.author)+'</a></div>':'<div class="quote-author">'+esc(q.author)+'</div>'):'';
            var textLink=q.url?'<a href="'+esc(q.url)+'" target="_blank" rel="noopener noreferrer"><span class="quote-text">'+esc(q.text)+'</span></a>':'<span class="quote-text">'+esc(q.text)+'</span>';
            quotes+='<div class="quote"><div class="quote-platform">'+esc(q.platform)+'</div>'+textLink+authorHtml+'</div>';
          });
          quotes+='</div>';
        }
        return '<div class="crowd-signal '+heatClass+'" style="animation-delay:'+(i*100)+'ms">'+
          '<div class="crowd-header">'+
            '<div class="crowd-name">'+esc(s.name)+'</div>'+
            '<div class="crowd-heat-badge"><span class="heat-flame">●</span>'+esc(s.heat||'warm')+'</div>'+
          '</div>'+
          '<div class="crowd-desc">'+esc(s.description)+'</div>'+
          '<div class="crowd-meta">'+sourceTags+volBars+sentiment+'</div>'+
          relatedNews+
          quotes+
        '</div>';
      }).join('');
    } else {
      crowdSignals.innerHTML='<div class="empty"><div class="empty-icon">∅</div><p>No crowd signals detected. The noise floor is low.</p></div>';
    }

    // News items
    if(data.items&&data.items.length){
      newsFeed.innerHTML=data.items.map(function(item,i){
        var projects='';
        if(item.projects&&item.projects.length){
          projects='<div class="news-projects">'+item.projects.map(function(p){return '<span class="project-tag">'+esc(p)+'</span>'}).join('')+'</div>';
        }
        var action=item.action?'<div class="news-action">'+esc(item.action)+'</div>':'';
        var soWhat=item.so_what?'<div class="news-so-what">'+esc(item.so_what)+'</div>':'';
        var titleHtml;
        if(item.url){
          titleHtml='<a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">'+esc(item.title)+'</a>';
        } else {
          titleHtml='<span class="no-link">'+esc(item.title)+'</span>';
        }
        var sourceIcon={
          'official':'◆','reddit':'⚡','linkedin':'in','twitter':'𝕏','blog':'◇'
        }[item.source_type]||'◆';

        return '<div class="news-item relevance-'+esc(item.relevance)+'" style="animation-delay:'+(i*50)+'ms">'+
          '<div class="news-meta">'+
            '<span class="news-source"><span class="source-icon">'+sourceIcon+'</span>'+esc(item.source)+'</span>'+
            '<span class="news-category">'+esc(item.category.replace(/-/g,' '))+'</span>'+
            '<span class="news-relevance">'+esc(item.relevance)+'</span>'+
          '</div>'+
          '<div class="news-title">'+titleHtml+'</div>'+
          '<div class="news-summary">'+esc(item.full_summary)+'</div>'+
          soWhat+projects+action+
        '</div>';
      }).join('');
    } else if(data.nothing_relevant){
      newsFeed.innerHTML='<div class="empty"><div class="empty-icon">∅</div><p>Nothing relevant in the last 48 hours. The signal is quiet.</p><div class="empty-code">next scan: tomorrow 06:00 UTC</div></div>';
    }
  }

  function renderEmpty(){
    footerDate.textContent=new Date().toISOString().split('T')[0];
    scanTime.textContent='no data loaded';
    crowdSignals.innerHTML='<div class="empty"><div class="empty-icon">∅</div><p>No signal data yet. This page updates automatically every morning at 6 AM.</p><div class="empty-code">next scan: tomorrow 06:00 UTC</div></div>';
  }
})();
</script>
</body>
</html>
